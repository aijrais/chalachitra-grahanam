<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Private match analyser · ChalaChitra</title>
  <link rel="stylesheet" href="./studio.css"><link rel="icon" href="./assets/icon-192.png">
  <script type="module" src="./match-connect.js"></script>
</head>
<body>
  <main>
    <div class="pagehead"><h1>Match analyser<span class="period">.</span></h1></div>
    <section class="panel"><div class="panelbody">
      <h2 id="matchTitle">Private link analysis</h2>
      <p id="progress" role="status">Connecting to the studio…</p>
      <div class="toolactions">
        <a class="btn primary" id="launchStudio" hidden>Open football studio</a>
        <button class="btn primary" id="run" hidden>Start match scan</button>
        <a class="btn primary" id="result" hidden>Review moments in studio</a>
        <a class="btn plain" id="back" hidden>Return to studio</a>
      </div>
    </div></section>
  </main>
</body>
</html>
